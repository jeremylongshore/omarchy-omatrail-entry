# Runtime remains dependency-free. Dependabot maintains the SHA-pinned Actions
# and the Node-only development verification stack.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
    labels:
      - dependencies
